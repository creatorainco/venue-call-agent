# Dependabot version updates: npm and GitHub Actions, weekly, into `dev` (the integration branch).
#
# The github-actions ecosystem keeps the SHA-pinned actions in .github/workflows current. Its
# pull requests edit workflow files, so each one is a workflow change: read it and merge it by
# hand like any other (Peter, 2026-11-13, B2c; VCA-SEC-4 / TEST-T7).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    ignore:
      # The runtime is Node 22 (.nvmrc, package.json engines), so the type
      # definitions stay on the 22 line. A major bump here would type-check
      # APIs that the deployed runtime does not have. Minor and patch updates
      # within 22.x still arrive.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
  # The Dockerfile's base image is pinned by digest (TASK-3748 step 4). This keeps the digest
  # current within Node 22.18; a minor or major Node bump is a hand edit of .nvmrc and the
  # Dockerfile together, which test/deployConfig.test.ts holds in step.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
