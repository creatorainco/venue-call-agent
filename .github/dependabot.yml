# Dependabot version updates: npm only, weekly, into `dev` (the integration branch).
#
# The github-actions ecosystem is left out on purpose. Its pull requests edit
# .github/workflows/*, and a workflow change needs an engineer's explicit approval.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
